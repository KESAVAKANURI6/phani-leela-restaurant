# CognoDB Connection - reads from environment variables
cognodb.uri=${COGNODB_URI:bolt://localhost:7687}
cognodb.username=${COGNODB_USERNAME:cognodb}
cognodb.password=${COGNODB_PASSWORD:password}

# Server port
server.port=${PORT:8080}
spring.application.name=PhaniLeela

# Logging
logging.level.com.phanileela=INFO
