<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phani Leela — Owner & Kitchen Dashboard 👑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=3" />
  <style>
    body {
      background: #0a0705;
      color: #fdf0e0;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      padding-top: 80px;
    }
    .owner-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(18, 13, 8, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(232, 93, 4, 0.25);
      padding: 0 24px;
      height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .owner-brand {
      display: flex; align-items: center; gap: 12px;
    }
    .owner-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem; font-weight: 700; color: #fbbf24;
    }
    .owner-badge {
      background: rgba(232, 93, 4, 0.15);
      border: 1px solid rgba(232, 93, 4, 0.4);
      color: #e85d04; font-size: 0.72rem; font-weight: 700;
      padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .owner-kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 22px;
      display: flex; align-items: center; gap: 16px;
    }
    .kpi-icon {
      font-size: 2rem; width: 48px; height: 48px;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
    }
    .kpi-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 800; color: var(--gold);
    }
    .kpi-lbl {
      font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .owner-controls {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 16px 20px; border-radius: 16px;
    }
    .search-input-wrap input {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 10px 16px; border-radius: 10px;
      font-size: 0.9rem; outline: none; width: 280px;
    }
    .search-input-wrap input:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,93,4,0.15);
    }
    .auto-refresh-toggle {
      display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted);
    }
    .order-cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .kitchen-order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .kitchen-order-card:hover {
      border-color: var(--accent); transform: translateY(-2px);
    }
    .kitchen-order-card.served {
      border-color: rgba(34,197,94,0.3); opacity: 0.85;
    }
    .kitchen-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border);
    }
    .kitchen-cust-name {
      font-weight: 700; font-size: 1.05rem; color: var(--text); margin-bottom: 4px;
    }
    .kitchen-time {
      font-size: 0.78rem; color: var(--muted);
    }
    .kitchen-items {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
    }
    .kitchen-item-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.9rem; background: rgba(255,255,255,0.03);
      padding: 6px 10px; border-radius: 8px;
    }
    .kitchen-note {
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
      color: #fbbf24; padding: 8px 12px; border-radius: 10px;
      font-size: 0.82rem; margin-bottom: 16px;
    }
    .kitchen-bottom {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
    }
    .kitchen-actions {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .btn-serve {
      background: linear-gradient(135deg, #16a34a, #22c55e); color: white;
      border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700;
      font-size: 0.82rem; cursor: pointer; transition: transform 0.15s;
    }
    .btn-serve:hover { transform: scale(1.03); }
    .btn-pay {
      background: rgba(251,191,36,0.15); color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.4); padding: 8px 14px; border-radius: 10px;
      font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: transform 0.15s;
    }
    .btn-pay:hover { background: rgba(251,191,36,0.3); transform: scale(1.03); }
    .btn-delete {
      background: rgba(239,68,68,0.12); color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3); padding: 8px 12px; border-radius: 10px;
      font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: background 0.15s;
    }
    .btn-delete:hover { background: rgba(239,68,68,0.25); }
  </style>
</head>
<body>

  <!-- Owner Header Bar -->
  <header class="owner-nav">
    <div class="owner-brand">
      <span style="font-size:1.8rem">🪔</span>
      <div>
        <div class="owner-title">Phani Leela Kitchen Portal</div>
        <div style="font-size:0.75rem;color:var(--muted)">Secret Owner Management Dashboard</div>
      </div>
      <span class="owner-badge">👑 OWNER ACCESS</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="liveClock" style="font-size:0.85rem;color:var(--muted);font-weight:700"></div>
      <a href="/" class="btn-outline" style="text-decoration:none;font-size:0.85rem">🍽️ View Customer Menu</a>
    </div>
  </header>

  <div class="container" style="max-width:1200px;margin:0 auto;padding:0 24px;">

    <!-- KPI Summary Bar -->
    <div class="owner-kpis">
      <div class="kpi-card">
        <div class="kpi-icon" style="color:#fbbf24">📋</div>
        <div>
          <div class="kpi-val" id="kpiTotal">0</div>
          <div class="kpi-lbl">Total Orders Today</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="color:#f59e0b">🟡</div>
        <div>
          <div class="kpi-val" id="kpiPreparing">0</div>
          <div class="kpi-lbl">Preparing</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="color:#22c55e">🟢</div>
        <div>
          <div class="kpi-val" id="kpiServed">0</div>
          <div class="kpi-lbl">Served</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="color:#e85d04">💰</div>
        <div>
          <div class="kpi-val" id="kpiRevenue">₹0</div>
          <div class="kpi-lbl">Total Revenue</div>
        </div>
      </div>
    </div>

    <!-- Controls Row -->
    <div class="owner-controls">
      <div class="search-input-wrap">
        <input type="text" id="ownerSearch" placeholder="🔍 Search Token # or Customer Name..." oninput="renderKitchenOrders()" />
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <label class="auto-refresh-toggle">
          <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()" />
          <span>⚡ Auto-refresh (every 4s)</span>
        </label>
        <button class="btn-outline" onclick="fetchAndRenderOrders()">🔄 Refresh Now</button>
        <button class="btn-outline" style="border-color:rgba(239,68,68,0.4);color:#ef4444;" onclick="resetAllOrdersOwner()">🗑️ Reset All Orders</button>
      </div>
    </div>

    <!-- Orders Board -->
    <div id="kitchenOrdersGrid" class="order-cards-grid">
      <div class="loading-spinner"></div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="/js/api.js?v=3"></script>
  <script>
    let allOrdersData = [];
    let autoRefreshTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      startClock();
      fetchAndRenderOrders();
      toggleAutoRefresh();
    });

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').textContent = '🕒 ' + now.toLocaleTimeString();
      }, 1000);
    }

    function toggleAutoRefresh() {
      const isChecked = document.getElementById('autoRefreshToggle').checked;
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      if (isChecked) {
        autoRefreshTimer = setInterval(() => {
          fetchAndRenderOrders(true); // silent fetch
        }, 4000);
      }
    }

    async function fetchAndRenderOrders(silent = false) {
      try {
        const orders = await Api.getOrders();
        allOrdersData = orders;
        updateKpis(orders);
        renderKitchenOrders();
      } catch (err) {
        if (!silent) {
          document.getElementById('kitchenOrdersGrid').innerHTML =
            `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load kitchen orders: ${err.message}</p></div>`;
        }
      }
    }

    function updateKpis(orders) {
      const total = orders.length;
      const preparing = orders.filter(o => (o.status || '').toLowerCase() === 'preparing').length;
      const served = orders.filter(o => (o.status || '').toLowerCase() === 'served').length;
      const revenue = orders.reduce((sum, o) => sum + (o.totalAmount || 0), 0);

      document.getElementById('kpiTotal').textContent = total;
      document.getElementById('kpiPreparing').textContent = preparing;
      document.getElementById('kpiServed').textContent = served;
      document.getElementById('kpiRevenue').textContent = '₹' + revenue.toLocaleString();
    }

    function renderKitchenOrders() {
      const grid = document.getElementById('kitchenOrdersGrid');
      const query = (document.getElementById('ownerSearch').value || '').trim().toLowerCase();

      let filtered = [...allOrdersData];
      if (query) {
        filtered = filtered.filter(o => {
          const name = (o.customerName || '').toLowerCase();
          const table = (o.tableNumber || '').toLowerCase();
          const id = (o.id || '').toLowerCase();
          const pay = (o.paymentMethod || '').toLowerCase();
          return name.includes(query) || table.includes(query) || id.includes(query) || pay.includes(query);
        });
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📋</div><p>No orders matched your search.</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(o => {
        const isServed = (o.status || '').toLowerCase() === 'served';
        const isPaid = (o.paymentStatus || '').toUpperCase() === 'PAID';
        const payMethod = o.paymentMethod || 'UPI';
        const rawTable = o.tableNumber || '';
        const isToken = rawTable.startsWith('TOKEN-');
        const tokenDisplay = isToken ? rawTable.replace('TOKEN-', '#') : rawTable;

        const itemsHtml = (o.items || []).map(i => `
          <div class="kitchen-item-row">
            <span>${i.emoji || '🍽️'} <strong>${i.quantity || 1}x</strong> ${i.name || i.menuItemName || 'Dish'}</span>
            <span style="color:var(--muted)">₹${(i.price || 0) * (i.quantity || 1)}</span>
          </div>
        `).join('');

        const formattedTime = o.createdAt ? new Date(o.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';

        const payBadge = isPaid
          ? `<span class="pay-badge-paid">✓ PAID (${payMethod})</span>`
          : `<span class="pay-badge-pending">⏳ UNPAID (${payMethod})</span>`;

        return `
          <div class="kitchen-order-card ${isServed ? 'served' : ''}">
            <div class="kitchen-top">
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
                  <span class="token-badge">🎫 Token ${tokenDisplay}</span>
                  ${payBadge}
                </div>
                <div class="kitchen-cust-name">👤 ${o.customerName || 'Guest'}</div>
                <div class="kitchen-time">🕒 ${formattedTime} • ID: ${(o.id || '').substring(0, 10)}</div>
              </div>
              <div class="order-status ${isServed ? 'status-served' : 'status-preparing'}">
                ${isServed ? 'Served 🟢' : 'Preparing 🟡'}
              </div>
            </div>

            <div class="kitchen-items">
              ${itemsHtml}
            </div>

            ${o.specialNote ? `
              <div class="kitchen-note">
                📝 <strong>Special Note:</strong> ${o.specialNote}
              </div>
            ` : ''}

            <div class="kitchen-bottom">
              <div style="font-weight:800;font-size:1.1rem;color:var(--gold);">₹${o.totalAmount || 0}</div>
              <div class="kitchen-actions">
                ${!isPaid ? `
                  <button class="btn-pay" onclick="markPaid('${o.id}')">Mark Paid 💰</button>
                ` : ''}
                ${!isServed ? `
                  <button class="btn-serve" onclick="markServed('${o.id}')">Mark Served 🟢</button>
                ` : ''}
                <button class="btn-delete" onclick="removeSingleOrder('${o.id}')">🗑️ Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markServed(id) {
      try {
        await Api.updateOrderStatus(id, 'Served');
        showToast('Order status updated to Served 🟢');
        fetchAndRenderOrders();
      } catch (err) {
        showToast('Failed to update status: ' + err.message, true);
      }
    }

    async function markPaid(id) {
      try {
        await Api.updatePaymentStatus(id, 'PAID');
        showToast('Payment status updated to PAID 💰');
        fetchAndRenderOrders();
      } catch (err) {
        showToast('Failed to update payment status: ' + err.message, true);
      }
    }

    async function removeSingleOrder(id) {
      if (!confirm('Are you sure you want to remove this order?')) return;
      try {
        await Api.deleteOrder(id);
        showToast('Order removed 🗑️');
        fetchAndRenderOrders();
      } catch (err) {
        showToast('Failed to delete order: ' + err.message, true);
      }
    }

    async function resetAllOrdersOwner() {
      if (!confirm('⚠️ Are you sure you want to RESET ALL ORDERS? This cannot be undone.')) return;
      try {
        await Api.deleteAllOrders();
        showToast('All orders cleared 🗑️');
        fetchAndRenderOrders();
      } catch (err) {
        showToast('Failed to reset orders: ' + err.message, true);
      }
    }

    let toastTimer;
    function showToast(msg, isErr = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.style.borderColor = isErr ? 'var(--nonveg)' : 'var(--veg)';
      toast.style.color = isErr ? 'var(--nonveg)' : 'var(--text)';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('show'), 10);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.classList.add('hidden'), 300);
      }, 3000);
    }
  </script>
</body>
</html>
